[package]
name = "particles_component"
version = "0.1.0"
edition = "2024"
description = "Particles (pulsar.particles): the particle emitter component, its rows and scene rows, and the plugin's Helio feature set (Corona)"

# The plugin's root crate (`particles_plugin`) links it and submits its
# component class, scene rows, animated content and render feature.
[lib]
name = "particles_component"

[features]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
default = ["gpu"]
gpu = []

[dependencies]
engine_class_derive = { workspace = true }
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
gpui-ce = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_scene_model = { workspace = true }
helio_component = { workspace = true }
# The engine-class derive logs through it.
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
wgpu = { workspace = true }
helio-feature-api = { workspace = true }
helio-scene-join = { workspace = true }
helio-pass-corona = { workspace = true }

[lints]
workspace = true
