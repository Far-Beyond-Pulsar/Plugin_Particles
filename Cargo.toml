[package]
name = "particles_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Particles (`pulsar.particles`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
# `examples/` is the plugin's examples crate, not this package's examples.
autoexamples = false

[features]
# Nothing yet: the plugin registers no editor UI (the inspector edits
# its component through reflected properties). Hosts turn it on with the
# rest of the installed set's editor registrations.
editor = []

[dependencies]
# The plugin gate and the registrations' collection.
pulsar_plugins = { workspace = true }
# The plugin's crates.
particles_component = { workspace = true }
# The engine seams the plugin registers into.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
pulsar_world_registry = { workspace = true }

[dev-dependencies]
# The moved test: the join places emitters at their owners and gives them
# their pool ranges (GPU).
helio = { workspace = true }
helio-core = { workspace = true }
helio-pass-corona = { workspace = true }
helio-scene-join = { workspace = true }
pulsar_scenedb = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
pollster = "=0.4.0"

[lints]
workspace = true
